spring.application.name=OC01
server.port=8080

# ==================== IMPORT .env ====================
# Cho phép Spring Boot ??c file .env ? th? m?c g?c
spring.config.import=optional:file:.env[.properties]

# ==================== DATABASE ====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.web.resources.static-locations=classpath:/static/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==================== OAUTH2 GOOGLE ====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==================== JWT ====================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# ==================== COOKIE ====================
cookie.access-token-name=access_token
cookie.refresh-token-name=refresh_token
cookie.domain=${COOKIE_DOMAIN}
cookie.path=/
cookie.secure=${COOKIE_SECURE}
cookie.http-only=true
cookie.same-site=Lax

# ==================== MULTIPART ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=uploads/

# ==================== MAIL ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=500

# ==================== VNPAY ====================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.api-url=${VNPAY_API_URL}
vnpay.return-url=${VNPAY_RETURN_URL}

# ==================== PAYPAL ====================
paypal.mode=${PAYPAL_MODE}
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}

# ==================== REDIS ====================
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# ==================== WEBSOCKET ====================
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS}

# ==================== JDBC BATCH ====================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.flushMode=COMMIT