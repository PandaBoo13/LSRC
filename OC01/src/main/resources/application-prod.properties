# ==================== LOGGING ====================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.root=WARN
logging.level.org.wisdom.oc01=INFO

logging.file.name=logs/oc01-app.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=3GB

# ==================== ERROR HANDLING ====================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ==================== COOKIE & SECURITY ====================
cookie.secure=true
cookie.domain=yourdomain.com

# ==================== DATABASE ====================
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ==================== SERVER ====================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

server.http2.enabled=true

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.max-http-form-post-size=10MB

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==================== WEBSOCKET ====================
app.websocket.allowed-origins=https://yourdomain.com,https://www.yourdomain.com

# ==================== OAUTH2 GOOGLE ====================
spring.security.oauth2.client.registration.google.redirect-uri=https://yourdomain.com/login/oauth2/code/google

# ==================== VNPAY ====================
vnpay.api-url=https://vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=https://yourdomain.com/api/orders/vnpay/callback

# ==================== PAYPAL ====================
paypal.mode=live

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ==================== STATIC RESOURCES ====================
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true